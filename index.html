<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1b2a3a" />
    <title>Muralha de Ferro</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M4 30V10h4v4h4v-4h8v4h4v-4h4v20z' fill='%23b9ad98' stroke='%2320160f' stroke-width='2'/%3E%3C/svg%3E" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #0e1620;
        overflow: hidden;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
      }
      #game { width: 100%; height: 100%; }
      /* Modal HTML para entrada de texto (apelido) */
      #modal {
        position: fixed; inset: 0; display: none;
        align-items: center; justify-content: center;
        background: rgba(5, 10, 18, 0.7); z-index: 10;
        font-family: 'Nunito', sans-serif;
      }
      #modal.open { display: flex; }
      #modal .box {
        background: linear-gradient(#3a2a1c, #2a1d12);
        border: 4px solid #c99a4a; border-radius: 18px;
        padding: 24px 28px; width: min(420px, 86vw); color: #fbeed3;
        box-shadow: 0 12px 40px rgba(0,0,0,.6); text-align: center;
      }
      #modal h2 { font-family: 'Cinzel', serif; margin: 0 0 8px; color: #ffd679; }
      #modal p { margin: 0 0 16px; opacity: .85; }
      #modal input {
        width: 100%; box-sizing: border-box; font-size: 20px; padding: 10px 14px;
        border-radius: 10px; border: 2px solid #c99a4a; background: #1a120b; color: #fff;
        font-family: inherit; outline: none; margin-bottom: 16px;
      }
      #modal .row { display: flex; gap: 10px; }
      #modal button {
        flex: 1; font-family: inherit; font-weight: 900; font-size: 18px; padding: 10px;
        border-radius: 10px; border: none; cursor: pointer;
      }
      #modal .ok { background: linear-gradient(#7ccf4a, #4c9a26); color: #fff; }
      #modal .skip { background: #5a4632; color: #fbeed3; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="modal">
      <div class="box">
        <h2>Bem-vindo, Comandante!</h2>
        <p>Como devemos te chamar?</p>
        <input id="nickInput" maxlength="16" placeholder="Seu apelido" />
        <div class="row">
          <button class="skip" id="nickSkip">Pular</button>
          <button class="ok" id="nickOk">Confirmar</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
